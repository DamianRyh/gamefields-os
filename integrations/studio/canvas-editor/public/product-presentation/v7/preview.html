<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gamefields — wzory perforacji</title><style>body{margin:0;padding:24px;background:#fbfafa;font-family:Arial,sans-serif;color:#49142f}main{max-width:980px;margin:auto}h1{font-size:28px;margin:0 0 20px}article{padding:20px;border:1px solid #e6dfe3;border-radius:16px;background:white}h2{margin:20px 0 12px;font-size:28px}p{color:#7e7378;line-height:1.5}.gh-model-media{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:10px;background:white}.gh-media-poster{width:100%;height:100%;object-fit:contain;display:block}a{color:inherit}*{box-sizing:border-box}@media(max-width:480px){body{padding:16px}article{padding:12px}h1{font-size:23px}h2{font-size:25px}}</style><main><h1>Wzory perforacji</h1><article><div id="preview"></div><h2>Konstrukcje stalowe</h2><p>Wybierz kształt. Rozbuduj zgodny system.</p></article></main><script>const node=(tag,props={},text)=>{const e=document.createElement(tag);Object.assign(e,props);if(text)e.textContent=text;return e};/* GF perforation pattern samples v7: construction category only. */
function constructionPatternPreview(){
 const options=[['round','Okręgi'],['square','Kwadraty'],['hex','Heksagony'],['wave','Fala'],['leaves','Liście'],['slots','Podłużne']];
 const wrap=node('div',{className:'gh-model-media gh-construction-detail gh-pattern-preview is-color'});wrap.dataset.constructionDetail='';let selected='round',request=0;
 const source=key=>'https://gamefields-studio.ryhfs90.chatgpt.site/product-presentation/v7/'+key+'.webp';
 const img=node('img',{className:'gh-media-poster',src:source(selected),alt:'Blacha perforowana — wzór Okręgi'});img.loading='lazy';img.decoding='async';
 const group=node('div',{className:'gh-pattern-options'});group.setAttribute('role','radiogroup');group.setAttribute('aria-label','Wzór perforacji blachy');
 const status=node('span',{className:'gh-pattern-label'},'Okręgi');status.setAttribute('role','status');status.setAttribute('aria-live','polite');
 const icon=key=>{const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');for(let y=0;y<3;y++)for(let x=0;x<3;x++){let shape;const cx=4+x*8,cy=4+y*8;if(key==='square'){shape=document.createElementNS(ns,'rect');for(const [a,v]of Object.entries({x:cx-2.4,y:cy-2.4,width:4.8,height:4.8,rx:.4}))shape.setAttribute(a,v)}else if(key==='hex'){shape=document.createElementNS(ns,'polygon');shape.setAttribute('points',Array.from({length:6},(_,i)=>[cx+3*Math.cos(i*Math.PI/3),cy+3*Math.sin(i*Math.PI/3)].join(',')).join(' '))}else if(key==='leaves'||key==='slots'){shape=document.createElementNS(ns,'ellipse');shape.setAttribute('cx',cx);shape.setAttribute('cy',cy);shape.setAttribute('rx',1.5);shape.setAttribute('ry',3.1);if(key==='leaves')shape.setAttribute('transform',`rotate(40 ${cx} ${cy})`)}else{shape=document.createElementNS(ns,'circle');shape.setAttribute('cx',cx);shape.setAttribute('cy',cy);shape.setAttribute('r',key==='wave'?1.1+(x+y)%3*.6:2.5)}svg.append(shape)}return svg};
 const choose=async key=>{const token=++request;wrap.setAttribute('aria-busy','true');const preload=new Image();preload.src=source(key);try{await preload.decode();if(token!==request||!wrap.isConnected)return;selected=key;img.src=preload.src;const name=options.find(v=>v[0]===key)[1];img.alt='Blacha perforowana — wzór '+name;status.textContent=name;buttons.forEach((b,i)=>{const active=options[i][0]===selected;b.setAttribute('aria-checked',String(active));b.tabIndex=active?0:-1})}catch(e){/* Preserve the last loaded pattern. */}finally{if(token===request)wrap.removeAttribute('aria-busy')}};
 const buttons=options.map(([key,name],index)=>{const b=node('button',{type:'button',className:'gh-pattern-dot'});b.title=name;b.setAttribute('role','radio');b.setAttribute('aria-label',name);b.setAttribute('aria-checked',String(key===selected));b.tabIndex=key===selected?0:-1;b.append(icon(key));b.addEventListener('click',()=>choose(key));b.addEventListener('keydown',e=>{let next=index;if(['ArrowRight','ArrowDown'].includes(e.key))next=(index+1)%options.length;else if(['ArrowLeft','ArrowUp'].includes(e.key))next=(index+options.length-1)%options.length;else if(e.key==='Home')next=0;else if(e.key==='End')next=options.length-1;else return;e.preventDefault();buttons[next].focus();choose(options[next][0])});group.append(b);return b});
 wrap.append(img,status,group);return wrap;
}
if(!document.getElementById('gf-pattern-style')){const s=document.createElement('style');s.id='gf-pattern-style';s.textContent='.gh-pattern-preview{position:relative}.gh-pattern-options{position:absolute;right:8px;bottom:8px;display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.96)}.gh-pattern-dot{display:grid!important;place-items:center;width:32px!important;height:32px!important;min-width:32px!important;padding:5px!important;border:1px solid transparent!important;border-radius:7px!important;background:transparent!important;cursor:pointer;color:#65696b}.gh-pattern-dot svg{width:21px;height:21px;fill:currentColor}.gh-pattern-dot[aria-checked="true"]{border-color:#49142f!important;color:#49142f;background:#f6eff3!important}.gh-pattern-dot:focus-visible{outline:2px solid #6633ff;outline-offset:2px}.gh-pattern-label{position:absolute;top:10px;left:10px;font-size:12px;line-height:1.3;padding:5px 8px;border-radius:6px;background:rgba(255,255,255,.94);color:#49142f}';document.head.append(s)}
document.getElementById('preview').append(constructionPatternPreview());</script></html>
