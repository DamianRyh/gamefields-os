name: Gamefields Global review CI
on:
  push:
    branches: [gamefields-global-pl-en]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: integrations/studio/canvas-editor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:i18n
      - run: pnpm exec tsc --noEmit
      - run: pnpm test:price
      - run: pnpm build
