name: Apply Court Redesigns Patch

on:
  push:
    branches:
      - feat/gamefields-play-v13-community-redesigns

permissions:
  contents: write

jobs:
  patch-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gamefields-play-v13-community-redesigns
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded Court patch
        run: node scripts/apply-court-redesigns.mjs
      - name: Commit Court page integration
        run: |
          if git diff --quiet -- app/play/court/page.tsx; then
            echo "No Court changes required."
            exit 0
          fi
          git config user.name "gamefields-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/play/court/page.tsx
          git commit -m "feat(play): surface community redesigns on Court"
          git push origin HEAD:feat/gamefields-play-v13-community-redesigns
